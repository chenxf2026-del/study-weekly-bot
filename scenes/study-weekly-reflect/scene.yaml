# scenes/study-weekly-reflect/scene.yaml — 学习小组周报自省场景
# (PRD: docs/internal/prd-study-weekly-reflect.md · 依据雅总《周报自省式诊断》v8)
#
# 「宽带规划学习小组」周报自省: 单教练评委 (v8-coach) 按 v8 框架出六段式个人诊断,
# 每周一 20:00 汇总上一周 (gen_study_weekly_summary, M2)。替代「小龙虾」机制。
# 自省式诊断, 评分与等级不进任何绩效口径 (PRD §1.3 红线)。

name: study-weekly-reflect
display_name: 学习小组周报自省
description: |
  宽带规划学习小组周报自省式诊断 (雅总 v8 框架)。
  周报不是"工作记录", 而是"价值证明" —— 5 维基础分 100 + 5 项反向扣分 (一维一项·上限29),
  个人六段式诊断回群, 每周一 20:00 出全组汇总。

panel: study-weekly-reflect

feishu:
  app_id_env: LARK_APP_ID_STUDY_WEEKLY
  app_secret_env: LARK_APP_SECRET_STUDY_WEEKLY
  bot_name: "学习小组周报评估"   # 主理拍板 2026-07-20; 建 app 时显示名须含此子串

access:
  whitelist_env: STUDY_WEEKLY_WHITELIST
  quota_per_user_daily: 30
  require_group: false
  allow_cloud_doc: true     # F1: 群里发飞书云文档链接 @机器人 即评 (app 须开 docx/wiki readonly)
  auto_review_title_keyword: "周报"  # ★ 标题闸 —— 两层含义, 别只记住第一层:
                            # ① 免 @ 触发 (主理 2026-07-22): 群里分享标题含「周报」的飞书云文档 → 不用 @ 即自动评审。
                            #    依赖 bot 能收群内非 @ 消息 (im:message.group_msg); 命令/引用评审仍需 @。
                            # ② **全路径硬门槛** (主理 2026-07-26): 云文档 / 直接发的 Word·PDF / 引用的文件,
                            #    标题 (文件名) 不含「周报」一律**不进评审**。免 @ 群分享静默跳过 (免刷屏),
                            #    显式 @ / 单聊则回卡说明原因。两种都不入队 → 不占配额。
                            # 未配此项的场景 (op2-* / meeting-review 等) 无标题门槛, 行为不变。
  group_open: true          # 群内 @机器人 即评, 不查白名单 (主理拍板 2026-07-20: 花名册简化,
                            # 群成员即授权); 配额仍生效
  trust_p2p: true           # 单聊默认放开白名单 (主理拍板 2026-07-20: "我会人工审核谁加机器人" ——
                            # 该 app 单聊可见性已被人工授权, 能单聊即已授权); 配额 10/日 仍生效

report:
  brand_prefix: study-weekly
  anchor_judge: null        # 单教练评委, 无锚点 (v8 框架已内嵌反向检视)
  redact_review: false      # 内部学习小组, 个人报告回群 (D1 拍板); 群投递另有全局兜底
  show_scores_publicly: false

scene_type: review
